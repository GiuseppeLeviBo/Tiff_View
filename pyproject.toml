[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiff-viewer"
version = "1.0.0"
description = "A simple Linux desktop viewer for scientific TIFF images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "tifffile>=2024.2.12",
]

[project.gui-scripts]
tiff-viewer = "tiff_viewer.app:main"

[tool.setuptools.packages.find]
include = ["tiff_viewer*"]

